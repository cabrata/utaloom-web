<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <title>Utaloom</title>
  <!-- ponytail: pure SVG CSS keyframes so it animates inside <img> tags without external JS; upgrade to inline SVG + Web Animations API if interactive playback sync is needed -->
  <style>
    .u-outer, .u-inner {
      stroke-dasharray: 1 2;
      stroke-dashoffset: 0;
      transform-origin: 128px 128px;
    }
    .u-outer {
      animation: weave-outer 3.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    .u-inner {
      animation: weave-inner 3.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes weave-outer {
      0%, 28%, 100% { stroke-dashoffset: 0; transform: scale(1); }
      58% { stroke-dashoffset: -1.15; transform: scale(0.96); }
      58.01% { stroke-dashoffset: 1.15; transform: scale(0.96); }
    }
    @keyframes weave-inner {
      0%, 22%, 100% { stroke-dashoffset: 0; transform: translateY(0); }
      52% { stroke-dashoffset: -1.15; transform: translateY(-4px); }
      52.01% { stroke-dashoffset: 1.15; transform: translateY(4px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .u-outer, .u-inner { animation: none; }
    }
  </style>
  <rect width="256" height="256" rx="64" fill="#29272c"/>
  <path class="u-outer" pathLength="1" d="M64 64v72c0 38 26 64 64 64s64-26 64-64V64" stroke="#f47757" stroke-width="32" stroke-linecap="round"/>
  <path class="u-inner" pathLength="1" d="M104 64v68c0 15 9 24 24 24s24-9 24-24V92" stroke="#ffc6a3" stroke-width="16" stroke-linecap="round"/>
</svg>
